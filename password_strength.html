
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Checker</title>
</head>
<body>

    <h1>Password Strength Checker</h1>

    <p>Enter a password to check its strength.</p>

    <form method="POST">

        <label>Enter Password:</label><br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Check Strength
        </button>

    </form>

    {% if strength %}
        <h2>{{ strength }}</h2>
    {% endif %}

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
